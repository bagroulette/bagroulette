name: Deploy BagRoulette

on:
  push:
    branches: [main]

jobs:
  # ─── Job 1: Deploy Frontend to Vercel ────────────────────────────────────────
  deploy-frontend:
    name: Frontend → Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL:      ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL:       ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_TOKEN_MINT:   ${{ secrets.NEXT_PUBLIC_TOKEN_MINT }}
          NEXT_PUBLIC_SOLANA_RPC:   ${{ secrets.NEXT_PUBLIC_SOLANA_RPC }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token:   ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id:  ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: '--prod'

  # ─── Job 2: Deploy Backend to VPS ────────────────────────────────────────────
  deploy-backend:
    name: Backend → VPS
    runs-on: ubuntu-latest
    needs: []  # runs in parallel with frontend
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     22
          script: |
            set -e
            cd /var/www/bagroulette
            
            echo "📦 Pulling latest code..."
            git pull origin main
            
            echo "📦 Installing dependencies..."
            composer install --optimize-autoloader --no-dev --quiet
            
            echo "🗃️  Running migrations..."
            php artisan migrate --force
            
            echo "🔄 Clearing caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan event:cache
            php artisan view:cache
            
            echo "🔄 Restarting workers..."
            sudo supervisorctl restart bagroulette-queue:*
            sudo supervisorctl restart bagroulette-reverb
            
            echo "✅ Backend deployed successfully!"

  # ─── Job 3: Health check after deploy ────────────────────────────────────────
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    steps:
      - name: Check API health
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.bagroulette.xyz/api/health)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Health check failed: HTTP $STATUS"
            exit 1
          fi
          echo "✅ API healthy: HTTP $STATUS"
